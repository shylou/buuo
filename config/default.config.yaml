# Buuo Gateway Configuration v2.0
# Multi-provider gateway configuration (Claude Code / Agent SDK / Codex CLI)

gateway:
  id: main_gateway

session:
  maxHistory: 50

router:
  defaultProvider: agent-sdk
  systemPrompt: |
    You are a helpful AI assistant answering questions in Chinese.
  maxTokens: 4096

# Lark/Feishu Channel Configuration
channels:
  lark-channel:
    - token: ${LARK_APP_ID}
      enabled: true
      options:
        appSecret: ${LARK_APP_SECRET}

# Provider Configuration
providers:
  claude-code-provider:
    # CLI-based Provider (Resume Mode)
    - id: claude-code
      enabled: false
      providerType: cli
      workingDirectory: /root/opendev
      enableTools: true
      requestTimeout: 600000
      allowedTools:
        - Read
        - Write
        - Edit
        - Grep
        - Glob
        - AskUserQuestion
        - Bash(python3:*)
        - Bash(git:*)
        - WebSearch
        - mcp__context7__*
        - mcp__jira__*
        - mcp__sequential-thinking__*
        - mcp__magic__*
        - mcp__web_reader__*
        - mcp__4_5v_mcp__*
        - mcp__zai-mcp-server__*
        - mcp__zread__*

    # Agent SDK Provider
    # workingDirectory: Where Agent SDK executes tasks (reads/writes files)
    # .mcp.json: Loaded from buuo project directory (contains MCP server configs)
    - id: agent-sdk
      enabled: true
      providerType: agent-sdk
      model: default
      workingDirectory: /root/opendev
      requestTimeout: 600000
      enableFileCheckpointing: false
      # Copy .mcp.json.example to .mcp.json and configure your MCP servers
      allowedTools:
        - Read
        - Write
        - Edit
        - Grep
        - Glob
        - Bash
        - Bash(python3:*)
        - Bash(git:*)
        - WebSearch
        - AskUserQuestion
        - mcp__context7__*
        - mcp__jira__*
        - mcp__sequential-thinking__*
        - mcp__magic__*
        - mcp__web_reader__*
        - mcp__4_5v_mcp__*
        - mcp__zai-mcp-server__*
        - mcp__zread__*

  codex-provider:
    - id: codex-cli
      enabled: false
      providerType: cli
      cliPath: codex
      workingDirectory: /root/opendev
      requestTimeout: 600000
      model: gpt-5.4
      fullAuto: true
      skipGitRepoCheck: false
      ephemeral: false
      configOverrides:
        - model_reasoning_effort="high"
