# Buuo Gateway Configuration
# Simplified configuration for Claude Code + Lark integration

gateway:
  id: main_gateway

session:
  maxHistory: 50

router:
  defaultProvider: claude-code
  systemPrompt: |
    You are a helpful AI assistant answering questions in Chinese.
  maxTokens: 4096

# Lark/Feishu Channel Configuration
channels:
  lark-channel:
    - token: ${LARK_APP_ID}
      enabled: true
      options:
        appSecret: ${LARK_APP_SECRET}

# Claude Code Provider Configuration (Resume Mode)
providers:
  claude-code-provider:
    - id: claude-code
      enabled: true
      workingDirectory: /root/opendev    # Default: /root/opendev
      enableTools: true
      requestTimeout: 300000
