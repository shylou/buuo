# Buuo Gateway Configuration v2.0
# Agent SDK Provider with MCP auto-loading from .mcp.json

gateway:
  id: main_gateway

session:
  maxHistory: 50

router:
  defaultProvider: agent-sdk
  systemPrompt: |
    You are a helpful AI assistant answering questions in Chinese.
  maxTokens: 4096

# Lark/Feishu Channel Configuration
channels:
  lark-channel:
    - token: ${LARK_APP_ID}
      enabled: true
      options:
        appSecret: ${LARK_APP_SECRET}

# Provider Configuration
providers:
  claude-code-provider:
    # CLI-based Provider (Resume Mode)
    - id: claude-code
      providerType: cli
      workingDirectory: /root/opendev
      enableTools: true
      requestTimeout: 300000
      allowedTools:
        - Read
        - Write
        - Edit
        - Grep
        - Glob
        - AskUserQuestion
        - Bash(python3:*)
        - Bash(git:*)
        - WebSearch
        - mcp__context7__*
        - mcp__jira__*
        - mcp__sequential-thinking__*
        - mcp__magic__*
        - mcp__web_reader__*
        - mcp__4_5v_mcp__*
        - mcp__zai-mcp-server__*
        - mcp__zread__*

    # Agent SDK Provider (Default)
    # workingDirectory: Where Agent SDK executes tasks (reads/writes files)
    # .mcp.json: Loaded from buuo project directory (contains MCP server configs)
    - id: agent-sdk
      providerType: agent-sdk
      model: default
      workingDirectory: /root/opendev
      requestTimeout: 300000
      enableFileCheckpointing: false
      # Copy .mcp.json.example to .mcp.json and configure your MCP servers
      allowedTools:
        - Read
        - Write
        - Edit
        - Grep
        - Glob
        - Bash
        - Bash(python3:*)
        - Bash(git:*)
        - WebSearch
        - AskUserQuestion
        - mcp__context7__*
        - mcp__jira__*
        - mcp__sequential-thinking__*
        - mcp__magic__*
        - mcp__web_reader__*
        - mcp__4_5v_mcp__*
        - mcp__zai-mcp-server__*
        - mcp__zread__*
