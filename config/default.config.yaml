# Buuo Gateway Configuration
# Simplified configuration for Claude Code + Lark integration

gateway:
  id: main_gateway

session:
  maxHistory: 50

router:
  defaultProvider: claude-code
  systemPrompt: |
    You are a helpful AI assistant answering questions in Chinese.
  maxTokens: 4096

# Lark/Feishu Channel Configuration
channels:
  lark-channel:
    - token: ${LARK_APP_ID}
      enabled: true
      options:
        appSecret: ${LARK_APP_SECRET}

# Claude Code Provider Configuration (Resume Mode)
providers:
  claude-code-provider:
    - id: claude-code
      enabled: true
      workingDirectory: /root/opendev    # Default: /root/opendev
      enableTools: true
      requestTimeout: 300000
      # Allowed tools for Claude Code (whitelist mode)
      # These tools will be passed via --allowed-tools flag
      allowedTools:
        - Read
        - Write
        - Edit
        - Grep
        - Glob
        - AskUserQuestion
        - Bash(python3:*)    # Required for skills that run Python scripts
        - Bash(git:*)        # Git operations
        - mcp__context7__*
        - mcp__jira__*
        - mcp__sequential-thinking__*
        - mcp__magic__*
        - mcp__web_reader__*
        - mcp__4_5v_mcp__*
        - mcp__zai-mcp-server__*
        - mcp__zread__*
