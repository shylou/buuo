# Lark-only configuration example
# Suitable for China users, no public IP required

gateway:
  id: main_gateway
  cleanupInterval: 300000

session:
  maxHistory: 50
  timeout: 3600000

router:
  defaultProvider: claude-code-local
  systemPrompt: |
    You are a helpful AI assistant answering questions in Chinese.
  temperature: 0.7
  maxTokens: 4096

# Only enable Lark channel
channels:
  lark-channel:
    - id: lark-main
      token: ${LARK_APP_ID}
      enabled: true
      options:
        appSecret: ${LARK_APP_SECRET}

# AI provider configuration
providers:
  claude-code-provider:
    - id: claude-code-default
      enabled: true
      workingDirectory: /root/opendev/buuo
      enableTools: true
